
name: Build One Piece IPTV APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q one_piece_iptv_github_build.zip -d source

      - name: Build APK
        run: gradle --no-daemon -p source/one_piece_iptv_starter :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: One-Piece-IPTV-APK
          path: source/one_piece_iptv_starter/app/build/outputs/apk/debug/app-debug.apk
